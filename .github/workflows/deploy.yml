name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: ssh compose up
    runs-on: ubuntu-latest
    steps:
      - name: Require deploy secrets
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=
          [ -n "$DEPLOY_KEY" ] || missing="$missing DEPLOY_KEY"
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$DEPLOY_PATH" ] || missing="$missing DEPLOY_PATH"
          if [ -n "$missing" ]; then
            echo "Missing deploy secrets:$missing"
            echo "Set them after the first manual server bootstrap (docs/production.md)."
            exit 1
          fi

      - name: Setup SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e
             cd \"$DEPLOY_PATH\"
             git pull origin main
             docker compose --env-file infra/.env.prod \
               -f infra/docker-compose.yml -f infra/docker-compose.prod.yml \
               up -d --build
             docker compose --env-file infra/.env.prod \
               -f infra/docker-compose.yml -f infra/docker-compose.prod.yml ps"

      - name: Smoke check
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          sleep 5
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e
             cd \"$DEPLOY_PATH\"
             addr=\$(grep -E '^UPSTREAM_ADDR=' infra/.env.prod | cut -d= -f2-)
             addr=\${addr:-10.88.0.1}
             curl -sf -o /dev/null \"http://\${addr}:3000/\" || curl -sf -o /dev/null \"http://\${addr}:8000/\""
