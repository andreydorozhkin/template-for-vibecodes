# Production overlay. Use together with the base file:
#   docker compose --env-file infra/.env.prod \
#     -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d --build
#
# Only SafeLine (infra/safeline/compose.yaml, started separately by npm run waf:up) faces the
# internet on host ports 80/443. Kong and the app listen on UPSTREAM_ADDR, a private dummy
# address (infra/scripts/upstream-addr.sh). SafeLine 9.4.3+ rejects 127.0.0.1 as an upstream.
# Postgres and Studio are not published. SonarQube stays on the base `sonar` profile and is
# not part of the default MVP server. Docker-published ports bypass ufw/firewalld, so nothing
# here may bind to 0.0.0.0.

services:
  db:
    ports: !reset []

  studio:
    # Off by default. For maintenance: add --profile admin and open an SSH tunnel to 127.0.0.1:54323.
    profiles: [admin]
    ports:
      - "127.0.0.1:54323:3000"

  kong:
    ports: !override
      - "${UPSTREAM_ADDR:?set UPSTREAM_ADDR in infra/.env.prod}:${KONG_HTTP_PORT:-8000}:8000"
    depends_on: !override
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
      storage:
        condition: service_healthy
      realtime:
        condition: service_healthy

  auth:
    environment:
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:?set SMTP_ADMIN_EMAIL in infra/.env.prod}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in infra/.env.prod}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT in infra/.env.prod}
      GOTRUE_SMTP_USER: ${SMTP_USER:?set SMTP_USER in infra/.env.prod}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:?set SMTP_PASS in infra/.env.prod}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:?set SMTP_SENDER_NAME in infra/.env.prod}

  app:
    ports: !override
      - "${UPSTREAM_ADDR:?set UPSTREAM_ADDR in infra/.env.prod}:${APP_PORT:-3000}:3000"
