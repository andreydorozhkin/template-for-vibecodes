sonar.projectKey=template-for-vibecodes
sonar.projectName=template-for-vibecodes

sonar.sources=app/app,app/components,app/lib,app/proxy.ts,supabase/functions
sonar.tests=app,supabase/functions
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*_test.ts
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*_test.ts,**/node_modules/**,**/.next/**,**/coverage/**,infra/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*_test.ts

sonar.javascript.lcov.reportPaths=app/coverage/lcov.info,supabase/functions/coverage.lcov
sonar.sourceEncoding=UTF-8

# Fail the scanner, and therefore CI, when the server quality gate fails.
sonar.qualitygate.wait=true
