title = "template gitleaks config (pre-commit)"

[extend]
path = ".gitleaks.toml"

[[rules]]
id = "password-assignment"
description = "Password assigned in config-like syntax"
regex = '''(?i)(?:password|passwd|pwd|smtp_pass|postgres_password|dashboard_password)\s*[:=]\s*['"]?([^\s'"#]{8,})['"]?'''
secretGroup = 1
entropy = 3.0
keywords = [
  "password",
  "passwd",
  "pwd",
  "smtp_pass",
  "postgres_password",
  "dashboard_password",
]

  [[rules.allowlists]]
  regexTarget = "secret"
  regexes = [
    '''(?i)^(REPLACE_ME|\*{3,}|changeme|change-me|your-.+|<.*>|xxx+|TODO|example|password|secret|to.?be.?set|fake_mail_password|fake_mail_user|actual_generated_password_value)$''',
    '''^(secret|alnum)\(\d+\),?$''',
    '''^(jwtSecret|anonKey|serviceRoleKey),?$''',
    '''^randomBytes\(\d+\)\.toString\($''',
    '''^Deno\.env\.get\($''',
    '''^\$\{[A-Z0-9_]+\}$''',
    '''^\$\{[A-Z0-9_]+:\?[a-z]*$''',
    '''^\$\{[A-Z0-9_]+:-(?:(?i)fake_mail_password|fake_mail_user|[a-z_][a-z0-9_]*)\}$''',
    '''^\$\{[A-Z0-9_]+:-\}$''',
    '''^String\(''',
  ]

[[rules]]
id = "docs-passwordish-assignment"
description = "Password/secret-like assignment inside docs artifacts"
path = '''(^|/)docs/'''
regex = '''(?i)(?:password|passwd|pwd|secret|token|api[_-]?key|service_role)\s*[:=]\s*['"]?([A-Za-z0-9!@#$%^&*_\-]{12,})['"]?'''
secretGroup = 1
entropy = 3.5
keywords = [
  "password",
  "passwd",
  "secret",
  "token",
  "api_key",
  "service_role",
]

  [[rules.allowlists]]
  regexTarget = "secret"
  regexes = [
    '''(?i)^(REPLACE_ME|\*{3,}|changeme|change-me|your-.+|<.*>|xxx+|TODO|example|password|secret|to.?be.?set|fake_mail_password|fake_mail_user)$''',
    '''^\$\{[A-Z0-9_]+\}$''',
    '''^\$\{[A-Z0-9_]+:\?[a-z]*$''',
    '''^\$\{[A-Z0-9_]+:-(?:(?i)fake_mail_password|fake_mail_user|[a-z_][a-z0-9_]*)\}$''',
    '''^\$\{[A-Z0-9_]+:-\}$''',
    '''^String\(''',
  ]